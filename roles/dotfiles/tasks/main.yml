- block:
  - name: Set default shell to bash for Mac
    become: yes
    command: chsh -s /bin/bash
    when: ansible_distribution == "MacOSX"

  - name: Ensure personal SSH configuration directory exists
    become: no
    ansible.builtin.file:
      path: "{{ home_dir }}/.ssh"
      state: directory
      mode: '0700'
    tags: dotfiles

  - name: Install SSH agent forwarding helpers
    become: no
    ansible.builtin.copy:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
      mode: "{{ item.mode }}"
    loop:
      - src: .ssh_rc
        dest: "{{ home_dir }}/.ssh/rc"
        mode: '0700'
      - src: .ssh_agent_forwarding
        dest: "{{ home_dir }}/.ssh/agent-forwarding.sh"
        mode: '0600'
    tags: dotfiles

  - name: Source SSH agent recovery before bash startup guards
    become: no
    ansible.builtin.blockinfile:
      path: "{{ home_dir }}/.bashrc"
      create: yes
      insertbefore: BOF
      marker: '# {mark} SSH agent forwarding'
      block: |
        if [ -r "$HOME/.ssh/agent-forwarding.sh" ]; then
            . "$HOME/.ssh/agent-forwarding.sh"
        fi
    tags: dotfiles

  - name: Copy relevant dotfiles
    become: no
    copy:
      src: "{{ item }}"
      dest: "~/"
      mode: 0664
    loop:
      - .carden_bashrc
      - .ctags
    tags: dotfiles

  - name: Insert/Update .bashrc to also source the .carden_bashrc
    become: no
    blockinfile:
      path: ~/.bashrc
      create: yes
      marker: '# {mark} Source personal bashrc'
      insertafter: EOF
      mode: 0664
      block: |
        if [ -f ~/.carden_bashrc ]; then . ~/.carden_bashrc; fi

  - name: Add local bin to path so we have access to our installations.
    become: no
    blockinfile:
      path: ~/.bashrc
      create: yes
      marker: '# {mark} Add ~/.local/bin to $PATH'
      insertafter: EOF
      mode: 0664
      block: |
        export PATH=$PATH:~/.local/bin

  - name: Source bashrc
    include_role:
      name: dotfiles
      tasks_from: source_bashrc

  - name: Refresh tmux conf
    include_role:
      name: tmux
      tasks_from: tmux_conf

  - name: Refresh vimrc
    include_role:
      name: vim
      tasks_from: vimrc

  - name: Set gitconfig
    include_role:
      name: git
      tasks_from: dotfiles
